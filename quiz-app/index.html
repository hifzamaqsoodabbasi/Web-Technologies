<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master</title>
    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        /* Screen Styles */
        .screen {
            display: none;
            padding: 40px;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .active {
            display: flex;
        }

        /* Welcome Screen */
        #welcome-screen h1 {
            color: #2575fc;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }

        #welcome-screen p {
            margin-bottom: 30px;
            font-size: 1.1rem;
            color: #555;
            line-height: 1.6;
        }

        /* Quiz Screen */
        #quiz-screen {
            padding: 30px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .question-count {
            font-weight: bold;
            color: #2575fc;
        }

        .score-display {
            font-weight: bold;
            color: #333;
        }

        .question-container {
            width: 100%;
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #333;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .option {
            padding: 15px;
            background-color: #f5f7ff;
            border: 2px solid #e1e5f1;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .option:hover {
            background-color: #e8edff;
            border-color: #2575fc;
        }

        .option.selected {
            background-color: #2575fc;
            color: white;
            border-color: #2575fc;
        }

        .option.correct {
            background-color: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }

        .option.wrong {
            background-color: #f44336;
            color: white;
            border-color: #f44336;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            min-height: 25px;
        }

        .correct-feedback {
            color: #4CAF50;
        }

        .wrong-feedback {
            color: #f44336;
        }

        .next-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #2575fc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .next-btn:hover {
            background-color: #1a68e8;
        }

        /* Result Screen */
        #result-screen h2 {
            color: #2575fc;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .final-score {
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0;
            color: #333;
        }

        .message {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #555;
        }

        .restart-btn {
            padding: 12px 30px;
            background-color: #2575fc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .restart-btn:hover {
            background-color: #1a68e8;
        }

        /* Button Styles */
        .btn {
            padding: 15px 40px;
            background-color: #2575fc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(37, 117, 252, 0.3);
        }

        .btn:hover {
            background-color: #1a68e8;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37, 117, 252, 0.4);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                border-radius: 10px;
            }
            
            .screen {
                padding: 25px;
            }
            
            #welcome-screen h1 {
                font-size: 2rem;
            }
            
            .question-text {
                font-size: 1.2rem;
            }
            
            .final-score {
                font-size: 2.5rem;
            }
            
            .message {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .screen {
                padding: 20px;
            }
            
            #welcome-screen h1 {
                font-size: 1.8rem;
            }
            
            .quiz-header {
                flex-direction: column;
                gap: 10px;
            }
            
            .question-text {
                font-size: 1.1rem;
            }
            
            .option {
                padding: 12px;
            }
            
            .btn, .next-btn, .restart-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Welcome Screen -->
        <div id="welcome-screen" class="screen active">
            <h1>Quiz Master</h1>
            <p>Test your knowledge with our interactive quiz! Answer 5 questions and see how well you score.</p>
            <button id="start-btn" class="btn">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <div class="question-count">Question: <span id="current-question">1</span>/5</div>
                <div class="score-display">Score: <span id="current-score">0</span></div>
            </div>
            <div class="question-container">
                <h2 class="question-text" id="question-text">Question text goes here</h2>
                <div class="options-container" id="options-container">
                    <!-- Options will be inserted here by JavaScript -->
                </div>
                <div class="feedback" id="feedback"></div>
            </div>
            <button id="next-btn" class="next-btn">Next Question</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <h2>Quiz Completed!</h2>
            <div class="final-score" id="final-score">0/5</div>
            <div class="message" id="result-message">Great Job!</div>
            <button id="restart-btn" class="restart-btn">Take Quiz Again</button>
        </div>
    </div>

    <script>
        // Quiz questions array
        const quizQuestions = [
            {
                question: "Which language runs in a web browser?",
                options: ["Java", "C", "Python", "JavaScript"],
                correctAnswer: 3
            },
            {
                question: "What does CSS stand for?",
                options: ["Central Style Sheets", "Cascading Style Sheets", "Cascading Simple Sheets", "Cars SUVs Sailboats"],
                correctAnswer: 1
            },
            {
                question: "Which of the following is not a JavaScript data type?",
                options: ["String", "Boolean", "Alert", "Number"],
                correctAnswer: 2
            },
            {
                question: "The 'flex' property in CSS is used for creating flexible layouts.",
                options: ["True", "False"],
                correctAnswer: 0
            },
            {
                question: "Which HTML tag is used to define an internal style sheet?",
                options: ["<script>", "<css>", "<style>", "<link>"],
                correctAnswer: 2
            }
        ];

        // DOM Elements
        const welcomeScreen = document.getElementById('welcome-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const currentQuestionElement = document.getElementById('current-question');
        const currentScoreElement = document.getElementById('current-score');
        const finalScoreElement = document.getElementById('final-score');
        const resultMessageElement = document.getElementById('result-message');
        const feedbackElement = document.getElementById('feedback');

        // Quiz state variables
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOption = null;
        let answerSubmitted = false;

        // Initialize the quiz
        function initQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            showScreen(welcomeScreen);
            updateScoreDisplay();
        }

        // Show a specific screen
        function showScreen(screen) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            screen.classList.add('active');
        }

        // Start the quiz
        function startQuiz() {
            showScreen(quizScreen);
            loadQuestion();
        }

        // Load the current question
        function loadQuestion() {
            const question = quizQuestions[currentQuestionIndex];
            questionText.textContent = question.question;
            optionsContainer.innerHTML = '';
            currentQuestionElement.textContent = currentQuestionIndex + 1;
            
            // Create option elements
            question.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.classList.add('option');
                optionElement.textContent = option;
                optionElement.dataset.index = index;
                optionElement.addEventListener('click', () => selectOption(optionElement));
                optionsContainer.appendChild(optionElement);
            });
            
            // Reset state for new question
            selectedOption = null;
            answerSubmitted = false;
            nextBtn.style.display = 'none';
            feedbackElement.textContent = '';
            feedbackElement.className = 'feedback';
        }

        // Handle option selection
        function selectOption(optionElement) {
            if (answerSubmitted) return;
            
            // Remove selected class from all options
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });
            
            // Add selected class to clicked option
            optionElement.classList.add('selected');
            selectedOption = parseInt(optionElement.dataset.index);
            
            // Submit answer automatically
            submitAnswer();
        }

        // Submit the answer
        function submitAnswer() {
            if (selectedOption === null || answerSubmitted) return;
            
            answerSubmitted = true;
            const question = quizQuestions[currentQuestionIndex];
            const options = document.querySelectorAll('.option');
            
            // Disable all options
            options.forEach(opt => {
                opt.style.pointerEvents = 'none';
            });
            
            // Check if answer is correct
            if (selectedOption === question.correctAnswer) {
                options[selectedOption].classList.add('correct');
                feedbackElement.textContent = 'Correct!';
                feedbackElement.classList.add('correct-feedback');
                score++;
                updateScoreDisplay();
            } else {
                options[selectedOption].classList.add('wrong');
                options[question.correctAnswer].classList.add('correct');
                feedbackElement.textContent = 'Wrong! The correct answer is: ' + question.options[question.correctAnswer];
                feedbackElement.classList.add('wrong-feedback');
            }
            
            // Show next button
            nextBtn.style.display = 'block';
        }

        // Move to the next question
        function nextQuestion() {
            currentQuestionIndex++;
            
            if (currentQuestionIndex < quizQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // Update the score display
        function updateScoreDisplay() {
            currentScoreElement.textContent = score;
        }

        // Show the results screen
        function showResults() {
            showScreen(resultScreen);
            finalScoreElement.textContent = `${score}/${quizQuestions.length}`;
            
            // Set result message based on score
            if (score === quizQuestions.length) {
                resultMessageElement.textContent = "Perfect! You're a Quiz Master!";
            } else if (score >= quizQuestions.length * 0.7) {
                resultMessageElement.textContent = "Great Job! You know your stuff!";
            } else if (score >= quizQuestions.length * 0.5) {
                resultMessageElement.textContent = "Good effort! Keep learning!";
            } else {
                resultMessageElement.textContent = "Try again! You can do better!";
            }
        }

        // Event Listeners
        startBtn.addEventListener('click', startQuiz);
        nextBtn.addEventListener('click', nextQuestion);
        restartBtn.addEventListener('click', initQuiz);

        // Initialize the quiz when the page loads
        window.addEventListener('DOMContentLoaded', initQuiz);
    </script>
</body>
</html>
